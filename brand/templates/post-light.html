<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap"><link rel="stylesheet" href="_shared.css">
<style>
  body { width:1080px; height:1080px; background:var(--white); color:var(--navy); display:flex; flex-direction:column; padding:64px 72px; }
  header { display:flex; align-items:center; gap:20px; }
  header img { width:84px; height:84px; border-radius:18px; background:var(--navy); padding:6px; }
  header .name { font-weight:800; font-size:30px; } header .name small { display:block; font-weight:400; font-size:17px; color:#64748B; letter-spacing:.12em; }
  main { flex:1; display:flex; flex-direction:column; justify-content:center; }
  .bar { width:120px; margin-bottom:36px; }
  h1 { font-size:64px; font-weight:800; line-height:1.45; max-width:20ch; }
  h1 em { font-style:normal; color:var(--blue); }
  p.sub { margin-top:26px; font-size:28px; color:#475569; max-width:34ch; line-height:1.7; }
  footer { display:flex; justify-content:space-between; align-items:center; color:#64748B; font-size:20px; border-top:1px solid var(--line); padding-top:26px; }
</style></head><body>
<header><img src="ots-logo.png" alt=""><div class="name">OneTech Solutions<small>INNOVATE • DEVELOP • SOLVE</small></div></header>
<main>
  <div class="bar"></div>
  <!-- عدّل: عنوان المنشور، ويمكن تلوين كلمة بـ <em> -->
  <h1>عنوان المنشور <em>بلمسة زرقاء</em> هنا</h1>
  <!-- عدّل: سطر توضيحي اختياري -->
  <p class="sub">سطر توضيحي قصير يشرح الفكرة بلغة بسيطة وصريحة.</p>
</main>
<footer><span>أنظمة أتمتة وذكاء اصطناعي تعمل بالعربية</span>
  <!-- اختياري: بعد اعتماد المعرّف الرسمي وفحص توفره أضفه هنا بصيغة <span dir="ltr">@المعرف</span> — لا يُطبع أي معرّف قبل ذلك --></footer>
</body></html>
