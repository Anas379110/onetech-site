<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap"><link rel="stylesheet" href="_shared.css">
<style>
  body { width:2560px; height:1440px; background:radial-gradient(50% 60% at 50% 50%, rgba(37,99,235,.28) 0%, rgba(37,99,235,0) 65%), linear-gradient(155deg,var(--navy) 0%,var(--navy-2) 100%); color:var(--white); position:relative; }
  /* منطقة الأمان 1546×423 في المنتصف تمامًا — كل النص والشعار داخلها */
  .safe { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:1546px; height:423px; display:flex; align-items:center; justify-content:center; gap:44px; }
  .safe img { width:190px; height:190px; border-radius:40px; background:#fff; padding:12px; flex:none; }
  .name { font-weight:800; font-size:76px; line-height:1.3; }
  .name small { display:block; font-weight:400; font-size:30px; color:var(--muted); letter-spacing:.16em; margin-top:6px; }
  .tag { margin-top:20px; color:var(--soft); font-size:38px; }
  .bar { width:190px; height:12px; margin-top:26px; }
</style></head><body>
<div class="safe">
  <img src="ots-logo.png" alt="">
  <div><div class="name">OneTech Solutions<small>INNOVATE • DEVELOP • SOLVE</small></div><div class="tag">أنظمة أتمتة وذكاء اصطناعي تعمل بالعربية</div><div class="bar"></div></div>
</div>
</body></html>
