<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap"><link rel="stylesheet" href="_shared.css">
<style>
  body { width:1080px; height:1920px; background:radial-gradient(80% 60% at 85% 6%, rgba(37,99,235,.38) 0%, rgba(37,99,235,0) 60%), linear-gradient(165deg,var(--navy) 0%,var(--navy-2) 100%); color:var(--white); display:flex; flex-direction:column; padding:96px 80px; }
  header { display:flex; align-items:center; gap:22px; }
  header img { width:96px; height:96px; border-radius:20px; background:#fff; padding:7px; }
  header .name { font-weight:800; font-size:34px; } header .name small { display:block; font-weight:400; font-size:19px; color:var(--muted); letter-spacing:.12em; }
  main { flex:1; display:flex; flex-direction:column; justify-content:center; }
  .bar { width:140px; height:10px; margin-bottom:44px; }
  h1 { font-size:84px; font-weight:800; line-height:1.4; max-width:16ch; }
  p.sub { margin-top:34px; font-size:34px; color:var(--soft); max-width:30ch; line-height:1.75; }
  .chip { display:inline-block; margin-top:48px; background:rgba(37,99,235,.18); border:2px solid rgba(96,165,250,.5); color:var(--sky); border-radius:999px; padding:16px 40px; font-size:26px; font-weight:700; width:fit-content; }
  footer { color:var(--muted); font-size:22px; border-top:1px solid rgba(255,255,255,.12); padding-top:30px; text-align:center; }
</style></head><body>
<header><img src="ots-logo.png" alt=""><div class="name">OneTech Solutions<small>INNOVATE • DEVELOP • SOLVE</small></div></header>
<main>
  <div class="bar"></div>
  <!-- عدّل: عنوان الستوري -->
  <h1>عنوان الستوري هنا</h1>
  <!-- عدّل: سطر توضيحي -->
  <p class="sub">سطر توضيحي قصير.</p>
  <!-- عدّل: وسم/تصنيف اختياري -->
  <span class="chip">أتمتة بالعربية</span>
</main>
<footer>أنظمة أتمتة وذكاء اصطناعي تعمل بالعربية
<!-- اختياري: بعد اعتماد المعرّف الرسمي وفحص توفره أضفه بصيغة <span dir="ltr">@المعرف</span> --></footer>
</body></html>
